<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState Lockdown Active</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(244, 63, 94, 0.3);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 35px rgba(244, 63, 94, 0.15);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 28rem;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.25rem;
    }

    .icon-container {
      margin: 0 auto 1.25rem;
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    p.description {
      font-size: 0.875rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .countdown-container {
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    .countdown-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }

    .countdown-number {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.5rem;
      font-weight: 800;
      color: #10b981;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 0.75rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #10b981, #14b8a6);
      transition: width 1s linear;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background: linear-gradient(135deg, #10b981, #0d9488);
      color: #020617;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 800;
      border-radius: 0.875rem;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">🚫</div>
    <div class="badge">Lockdown Active</div>
    <h1>Site Blocked</h1>
    <p class="description">
      🚫 Focus Lockdown Active. This site is blocked during your FlowState session. Return to FlowState.
    </p>

    <div class="countdown-container">
      <div class="countdown-text">Auto-redirecting back to deep flow in</div>
      <div class="countdown-number" id="countdown">3s</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress"></div>
      </div>
    </div>

    <a href="http://localhost:3000" id="return-link" class="button">
      Return to FlowState Now →
    </a>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
